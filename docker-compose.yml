services:
  bookies:
    build: .
    image: bookies
    container_name: bookies
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Holds bookmarks.json, config.json and the cookie encryption keys. Back this up.
      - ./data:/data
    environment:
      BOOKIES__TITLE: Bookies

      # Credentials are seeds, read only on the very first start. Once /data/config.json exists
      # these are ignored — change the password from the Settings page instead. Leave both unset
      # and a random password is generated and printed once to the log.
      # BOOKIES__USERNAME: urza
      # BOOKIES__PASSWORD: pick-something-long

      # Optional auto-tagging against any OpenAI-compatible server on your network.
      # AI__ENABLED: "true"
      # AI__BASEURL: http://192.168.1.50:11434/v1
      # AI__MODEL: qwen3:8b
      # AI__MAXTAGS: "5"

      # Only behind a reverse proxy you control.
      # BOOKIES__TRUSTPROXYHEADERS: "true"
