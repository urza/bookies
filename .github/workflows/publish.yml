name: publish

# Builds the image and pushes it to GHCR. There is no separate build job: the Dockerfile compiles
# with warnings-as-errors, so a broken commit fails here before anything is published.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN is enough to push to this repository's own package. No PAT needed here —
      # only on the deployment machine, and only while the package is private.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Restore and publish layers survive between runs, so a code-only change rebuilds in
          # seconds instead of pulling the SDK image again.
          cache-from: type=gha
          cache-to: type=gha,mode=max
